services:
  backend:
    environment:
      STUDYDY_SEMANTIC_BASE_URL: http://model-bridge:18000
    depends_on:
      model-bridge:
        condition: service_healthy

  model-bridge:
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
      target: ssh-bridge
    user: "${STUDYDY_UID:-1000}:${STUDYDY_GID:-1000}"
    environment:
      STUDYDY_SSH_HOST: ${STUDYDY_SSH_HOST:?Set SSH destination for the optional bridge}
      STUDYDY_SSH_PORT: ${STUDYDY_SSH_PORT:-22}
      STUDYDY_SSH_MODEL_PORT: ${STUDYDY_SSH_MODEL_PORT:-18000}
    volumes:
      - type: bind
        source: ${STUDYDY_DATA_DIR:-./data}/ssh/model_key
        target: /run/secrets/model_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STUDYDY_DATA_DIR:-./data}/ssh/known_hosts
        target: /run/secrets/known_hosts
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/backend/.venv/bin/python", "-c", "import socket; socket.create_connection(('127.0.0.1',18000),timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [application]
