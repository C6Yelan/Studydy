<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studydy - 重設密碼</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/dashboard.css">

  <style>
    body {
      height: 100vh; /* 強制全螢幕高度 */
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      overflow: hidden; /* ★ 關鍵：隱藏卷軸 */
    }

    .auth-card {
      background: #ffffff;
      width: 95%;
      max-width: 600px; /*稍微加寬一點，讓並排不擁擠*/
      /* ★ 縮小內距 */
      padding: 1.8rem 2.5rem; 
      border-radius: 2rem;
      box-shadow: 0 10px 40px rgba(73, 117, 250, 0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      /* 確保卡片不會超過視窗高度 */
      max-height: 95vh;
    }

    /* Logo 縮小 */
    .auth-logo {
      width: 140px; /* 原本 180px */
      height: auto;
      display: block;
      margin: 0 auto 0.5rem auto; /* 減少下方 margin */
    }

    .auth-title {
      font-family: var(--font-serif);
      font-size: 1.5rem; /* 稍微縮小字體 */
      color: #1a1a1a;
      margin-bottom: 0.2rem;
      font-weight: 700;
    }

    .auth-subtitle {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 1.2rem; /* 減少間距 */
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 0.8rem; /* ★ 關鍵：大幅減少欄位間距 (原本 1.5rem) */
      text-align: left;
    }
    
    .auth-label {
        display: block;
        margin-bottom: 0.3rem;
        font-weight: 600;
        color: #333;
        font-size: 0.85rem;
        margin-left: 5px;
    }

    /* 通用輸入框 */
    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
    }

    .auth-input {
      width: 100%;
      padding: 0.7rem 1.2rem; /*稍微縮小 padding*/
      border-radius: 50px;
      border: 2px solid #eff6ff;
      background: #f5f9ff;
      font-size: 0.95rem;
      color: #333;
      transition: all 0.3s ease;
      font-family: var(--font-main);
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #fff;
    }

    /* --- 驗證碼方塊 --- */
    .otp-container {
        display: flex;
        justify-content: space-between;
        gap: 6px;
    }

    .otp-input {
        width: 100%;
        height: 45px; /* ★ 縮小高度 (原本 55px) */
        border-radius: 10px;
        border: 2px solid #eff6ff;
        background: #f5f9ff;
        text-align: center;
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--primary-color);
        transition: all 0.2s;
    }

    .otp-input:focus {
        outline: none;
        border-color: var(--primary-color);
        background: #fff;
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(73, 117, 250, 0.15);
    }

    /* 驗證碼發送按鈕群組 */
    .email-group {
        display: flex;
        gap: 8px;
    }
    
    .verify-btn {
        white-space: nowrap;
        padding: 0 1rem;
        border-radius: 50px;
        border: 1px solid var(--primary-color);
        background: white;
        color: var(--primary-color);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.9rem;
    }
    .verify-btn:hover { background: #eff6ff; }
    .verify-btn:disabled {
        border-color: #ccc; color: #999; cursor: not-allowed; background: #f5f5f5;
    }

    /* 眼睛圖示 */
    .password-toggle {
        position: absolute;
        right: 15px;
        color: #aaa;
        cursor: pointer;
        padding: 5px;
        z-index: 10;
    }

    .auth-btn {
      margin-top: 0.5rem; /* 減少上方間距 */
      padding: 0.8rem;
      border-radius: 50px;
      border: none;
      background: #6a8eff;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .auth-btn:hover { background: #4975fa; transform: translateY(-2px); }

    .auth-back-link {
      display: inline-block;
      margin-top: 1rem; /* 減少間距 */
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .error-text { color: #ff4d4f; font-size: 0.8rem; margin-left: 10px; margin-top: 2px; display: none; }
    .success-text { color: #28c76f; font-size: 0.8rem; margin-left: 10px; margin-top: 2px; display: none; }

    /* ★ 關鍵佈局：讓密碼欄位並排顯示 */
    .row-group {
        display: flex;
        gap: 15px;
    }
    .row-group > div {
        flex: 1; /* 平均分配寬度 */
    }

    /* RWD: 當螢幕真的很小時，或是手機版，還是改回垂直排列以免太擠 */
    @media (max-width: 500px) {
        .row-group {
            flex-direction: column;
            gap: 0.8rem;
        }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <img src="logo.png" alt="Studydy Logo" class="auth-logo">
    
    <h1 class="auth-title">重設密碼</h1>
    <p class="auth-subtitle">請輸入電子郵件獲取驗證碼，並設定新密碼。</p>

    <form class="auth-form" id="reset-form">
      
      <div>
          <label class="auth-label">電子郵件</label>
          <div class="email-group">
              <input type="email" class="auth-input" id="email" placeholder="name@example.com" required>
              <button type="button" class="verify-btn" id="send-code-btn">發送驗證碼</button>
          </div>
          <div class="success-text" id="email-msg"><i class="fas fa-check-circle"></i> 驗證碼已發送</div>
      </div>

      <div>
          <label class="auth-label">輸入 6 位數驗證碼</label>
          <div class="otp-container" id="otp-inputs">
              <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
              <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
              <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
              <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
              <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
              <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          </div>
      </div>

      <div class="row-group">
          <div>
              <label class="auth-label">新密碼</label>
              <div class="input-wrapper">
                  <input type="password" class="auth-input" id="new-password" placeholder="8+ 字元" required minlength="8">
                  <i class="fas fa-eye password-toggle" onclick="togglePassword('new-password', this)"></i>
              </div>
          </div>

          <div>
              <label class="auth-label">確認新密碼</label>
              <div class="input-wrapper">
                  <input type="password" class="auth-input" id="confirm-password" placeholder="再次輸入" required>
                  <i class="fas fa-eye password-toggle" onclick="togglePassword('confirm-password', this)"></i>
              </div>
          </div>
      </div>
      
      <div class="error-text" id="password-error" style="margin-top: -5px; text-align: left;"><i class="fas fa-exclamation-circle"></i> 密碼不一致</div>

      <button type="submit" class="auth-btn">重設並登入</button>
    </form>

    <a href="login.html" class="auth-back-link">
        <i class="fas fa-arrow-left"></i> 返回登入
    </a>
  </div>

  <script>
    // --- 1. 驗證碼方塊輸入邏輯 ---
    const otpInputs = document.querySelectorAll('.otp-input');

    otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            const value = e.target.value;
            e.target.value = value.replace(/[^0-9]/g, '');

            if (e.target.value) {
                if (index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                if (!input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            }
        });
        
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            const digits = text.replace(/[^0-9]/g, '').split('').slice(0, 6);
            digits.forEach((digit, i) => {
                if (otpInputs[i]) otpInputs[i].value = digit;
            });
            if (digits.length > 0) {
                const targetIndex = Math.min(digits.length, 5);
                otpInputs[targetIndex].focus();
            }
        });
    });

    // --- 2. 發送按鈕邏輯 ---
    const sendBtn = document.getElementById('send-code-btn');
    const emailMsg = document.getElementById('email-msg');
    
    sendBtn.addEventListener('click', () => {
        const emailVal = document.getElementById('email').value;
        if(!emailVal) { alert('請先輸入電子郵件'); return; }

        sendBtn.disabled = true;
        sendBtn.innerText = '發送中...';
        
        setTimeout(() => {
            sendBtn.innerText = '已發送';
            emailMsg.style.display = 'block';
            let count = 60;
            const timer = setInterval(() => {
                sendBtn.innerText = `${count}s`;
                count--;
                if(count < 0) {
                    clearInterval(timer);
                    sendBtn.disabled = false;
                    sendBtn.innerText = '重發';
                }
            }, 1000);
        }, 1500);
    });

    // --- 3. 顯示/隱藏密碼 ---
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = "password";
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // --- 4. 表單提交 ---
    document.getElementById('reset-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const p1 = document.getElementById('new-password').value;
        const p2 = document.getElementById('confirm-password').value;
        
        let otpCode = '';
        otpInputs.forEach(input => otpCode += input.value);
        if(otpCode.length < 6) {
            alert('請完整輸入 6 位數驗證碼');
            return;
        }

        if(p1 !== p2) {
            document.getElementById('password-error').style.display = 'block';
            return;
        } else {
            document.getElementById('password-error').style.display = 'none';
        }

        const btn = this.querySelector('.auth-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 重設中...';
        
        setTimeout(() => {
            alert('重設成功！即將跳轉登入頁面。');
            window.location.href = 'login.html';
        }, 1500);
    });
  </script>

</body>
</html>
