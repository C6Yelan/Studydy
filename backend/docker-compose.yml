services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studydy_dev}
      POSTGRES_USER: ${POSTGRES_USER:-studydy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studydy_dev_password}
    ports:
      # Dev/test Postgres is published on localhost only, not external interfaces.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - studydy_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studydy_postgres_data:
