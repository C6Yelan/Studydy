services:
  unit:
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
      target: test
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/docker/bubblewrap-seccomp.json
    tmpfs:
      # 合成子程序須可執行；短片測試沿用 renderer 的 2 GiB 可用空間檢查。
      - /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777
