services:
  init:
    image: ${COMPOSE_PROJECT_NAME:-studydy}-backend
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
      target: backend
      args:
        STUDYDY_BACKEND_UID: ${STUDYDY_BACKEND_UID:-20001}
    user: "0:0"
    command: ["init"]
    environment:
      STUDYDY_UID: ${STUDYDY_UID:-1000}
      STUDYDY_GID: ${STUDYDY_GID:-1000}
      STUDYDY_BACKEND_UID: ${STUDYDY_BACKEND_UID:-20001}
    volumes:
      - ${STUDYDY_DATA_DIR:-./data}:/data
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studydy}
      POSTGRES_USER: ${POSTGRES_USER:-studydy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - ${STUDYDY_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [database]

  backend:
    image: ${COMPOSE_PROJECT_NAME:-studydy}-backend-ocr
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
      target: ocr
      args:
        STUDYDY_BACKEND_UID: ${STUDYDY_BACKEND_UID:-20001}
    devices:
      - nvidia.com/gpu=all
    user: "${STUDYDY_BACKEND_UID:-20001}:${STUDYDY_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studydy}
      POSTGRES_USER: ${POSTGRES_USER:-studydy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      STUDYDY_PUBLIC_ORIGIN: ${STUDYDY_PUBLIC_ORIGIN:-http://127.0.0.1:4173}
      STUDYDY_UPLOAD_MAX_BYTES: ${STUDYDY_UPLOAD_MAX_BYTES:-104857600}
      STUDYDY_SECURE_COOKIE: ${STUDYDY_SECURE_COOKIE:-false}
      STUDYDY_SEMANTIC_BASE_URL: ${STUDYDY_SEMANTIC_BASE_URL:-http://host.docker.internal:18000}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      STUDYDY_TEXT_TEST_PROVIDER: ${STUDYDY_TEXT_TEST_PROVIDER:-}
      STUDYDY_MATERIAL_WORKERS: ${STUDYDY_MATERIAL_WORKERS:-1}
      STUDYDY_NOTES_CHAPTER_CONCURRENCY: ${STUDYDY_NOTES_CHAPTER_CONCURRENCY:-1}
      STUDYDY_MATERIAL_REVIEW_CONCURRENCY: ${STUDYDY_MATERIAL_REVIEW_CONCURRENCY:-1}
      STUDYDY_CARD_WORKERS: ${STUDYDY_CARD_WORKERS:-1}
      STUDYDY_PODCAST_WORKERS: ${STUDYDY_PODCAST_WORKERS:-1}
      STUDYDY_RESEARCH_WORKERS: ${STUDYDY_RESEARCH_WORKERS:-1}
      STUDYDY_LUNA_PARALLEL_TEST: ${STUDYDY_LUNA_PARALLEL_TEST:-0}
      STUDYDY_PODCAST_PROVIDER_URL: ${STUDYDY_PODCAST_PROVIDER_URL:-}
      STUDYDY_PODCAST_PROVIDER_TOKEN: ${STUDYDY_PODCAST_PROVIDER_TOKEN:-}
      STUDYDY_OPENALEX_API_KEY: ${STUDYDY_OPENALEX_API_KEY:-}
      STUDYDY_SEMANTIC_SCHOLAR_API_KEY: ${STUDYDY_SEMANTIC_SCHOLAR_API_KEY:-}
      STUDYDY_UNPAYWALL_EMAIL: ${STUDYDY_UNPAYWALL_EMAIL:-}
      STUDYDY_SEARXNG_URL: ${STUDYDY_SEARXNG_URL:-http://research-search:8080}
    volumes:
      - ${STUDYDY_DATA_DIR:-./data}/artifacts:/data/artifacts
      - ${STUDYDY_DATA_DIR:-./data}/models/unlimited-ocr:/opt/studydy/models/unlimited-ocr:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
      - /opt/studydy/runtime:rw,nosuid,nodev,size=16m,mode=0700,uid=${STUDYDY_BACKEND_UID:-20001},gid=${STUDYDY_GID:-1000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./ops/docker/bubblewrap-seccomp.json
    pids_limit: 512
    healthcheck:
      test: ["CMD", "/app/backend/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/ready', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [database, application]

  research-search:
    image: searxng/searxng@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    user: "977:977"
    entrypoint: ["/bin/sh", "/usr/local/bin/start-studydy-search.sh"]
    environment:
      FORCE_OWNERSHIP: "false"
      GRANIAN_HOST: "0.0.0.0"
      GRANIAN_PORT: "8080"
      GRANIAN_WORKERS: "1"
      GRANIAN_LOG_LEVEL: "error"
    volumes:
      - ./ops/search/settings.yml:/etc/searxng/settings.yml:ro
      - ./ops/search/start-search.sh:/usr/local/bin/start-studydy-search.sh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
      - /var/cache/searxng:rw,nosuid,nodev,size=64m,uid=977,gid=977,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 6
    restart: unless-stopped
    networks: [application]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  frontend:
    environment:
      STUDYDY_UPLOAD_MAX_BYTES: ${STUDYDY_UPLOAD_MAX_BYTES:-104857600}
    build:
      context: .
      dockerfile: ops/docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports: ["127.0.0.1:${STUDYDY_PORT:-4173}:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [application]

  model-bridge:
    profiles: [ssh]
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
      target: ssh-bridge
    user: "${STUDYDY_UID:-1000}:${STUDYDY_GID:-1000}"
    environment:
      STUDYDY_SSH_HOST: ${STUDYDY_SSH_HOST:-}
      STUDYDY_SSH_PORT: ${STUDYDY_SSH_PORT:-22}
      STUDYDY_SSH_MODEL_PORT: ${STUDYDY_SSH_MODEL_PORT:-18000}
    volumes:
      - type: bind
        source: ${STUDYDY_SSH_KEY_FILE:-${STUDYDY_DATA_DIR:-./data}/ssh/model_key}
        target: /run/secrets/model_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STUDYDY_SSH_KNOWN_HOSTS_FILE:-${STUDYDY_DATA_DIR:-./data}/ssh/known_hosts}
        target: /run/secrets/known_hosts
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/backend/.venv/bin/python", "-c", "import socket; socket.create_connection(('127.0.0.1',18000),timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [application]

  download-ocr:
    profiles: [tools]
    image: ${COMPOSE_PROJECT_NAME:-studydy}-backend-ocr
    build:
      context: .
      dockerfile: ops/docker/backend.Dockerfile
      target: ocr
      args:
        STUDYDY_BACKEND_UID: ${STUDYDY_BACKEND_UID:-20001}
    user: "${STUDYDY_UID:-1000}:${STUDYDY_GID:-1000}"
    command: ["--lock", "/app/local_ai/runtime-lock.json", "--output", "/models"]
    entrypoint: ["/opt/studydy/ocr/runtime/bin/python", "-m", "studydy_local_ai.download"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${STUDYDY_DATA_DIR:-./data}/models/unlimited-ocr:/models
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]

networks:
  database:
    internal: true
  application:
