upstream studydy_backend {
    zone studydy_backend 64k;
    # 後端容器重建後，透過 Docker DNS 更新位址，避免持續連向舊 IP。
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8001 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    access_log off;

    location ~ ^/v[0-9]+(?:/|$) {
        proxy_pass http://studydy_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
