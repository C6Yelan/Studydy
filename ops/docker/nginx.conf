upstream studydy_backend {
    zone studydy_backend 64k;
    # 後端容器重建後，透過 Docker DNS 更新位址，避免持續連向舊 IP。
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8001 resolve;
}

server {
    listen 8080 default_server;
    server_name "";
    return 400;
}

server {
    listen 8080;
    server_name studydy.net 127.0.0.1 localhost;
    root /usr/share/nginx/html;
    index index.html;
    # 私有 HTTP hop 不應產生帶 scheme／8080 的外部 redirect。
    absolute_redirect off;
    client_max_body_size ${STUDYDY_UPLOAD_MAX_BYTES};
    access_log off;

    # 圖庫實驗已整合正式概念卡，舊測試入口不回退到 SPA。
    location = /icon-lab { return 404; }
    location ^~ /icon-lab/ { return 404; }

    # 已結束開源視覺生成測試，成果頁與資產不回退到 SPA。
    location = /podcast-visual-test { return 404; }
    location ^~ /podcast-visual-test/ { return 404; }

    # 已撤回動畫實驗，舊展示網址不回退到 SPA。
    location = /animation-poc-review { return 404; }
    location ^~ /animation-poc-review/ { return 404; }

    location = /podcast-video-comparison { return 404; }
    location ^~ /podcast-video-comparison/ { return 404; }
    location ^~ /v1/podcast-video-comparison/ { return 404; }

    location ~ ^/v[0-9]+(?:/|$) {
        proxy_pass http://studydy_backend;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-Connecting-IPv6 "";
        proxy_set_header CF-Pseudo-IPv4 "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Access-Jwt-Assertion "";
        proxy_set_header CF-Access-Authenticated-User-Email "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    # 已結束的試聽入口不回退到 SPA，也不再提供舊音訊。
    location = /podcast-voice-comparison { return 404; }
    location ^~ /podcast-voice-comparison/ { return 404; }
    location ~ ^/voice-compare- { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
